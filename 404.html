<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D1B3E">
<title>Pagina niet gevonden · TimmersDesign</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--ink:#0D1B3E;--paper:#EDEFF5;--stamp:#F4762A;--graphite:#4A5568;--line:rgba(13,27,62,0.14);--line-soft:rgba(13,27,62,0.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Newsreader',Georgia,serif;background:var(--paper);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;align-items:center;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:48px 48px}
main{max-width:640px;padding:3rem 1.6rem;margin:0 auto}
.code{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.82rem;letter-spacing:.02em;margin-bottom:1.2rem}
.code span{text-decoration:underline;text-decoration-color:var(--stamp);text-decoration-thickness:2px;text-underline-offset:4px}
h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;letter-spacing:-.02em;text-wrap:balance;margin-bottom:1.2rem}
p{font-size:1.15rem;line-height:1.7;color:var(--graphite);margin-bottom:2rem}
.knoppen{display:flex;gap:1rem;flex-wrap:wrap}
.btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.85rem;padding:.9rem 1.8rem;text-decoration:none;display:inline-block;transition:background .25s,color .25s,border-color .25s}
.btn-solid{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.btn-solid:hover{background:var(--stamp);border-color:var(--stamp);color:var(--ink)}
.btn-outline{color:var(--ink);border:1px solid var(--line)}
.btn-outline:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tel{margin-top:2.4rem;font-family:'Space Grotesk',sans-serif;font-size:.9rem;color:var(--graphite)}
.tel a{color:var(--ink)}
@media(max-width:480px){.knoppen{flex-direction:column}.btn{text-align:center}}
</style>
</head>
<body>
<main>
  <p class="code">Fout 404 · <span>pagina niet gevonden</span></p>
  <h1>Deze pagina bestaat niet (meer).</h1>
  <p>Misschien is de link verouderd of zit er een typfout in. Geen probleem: hieronder vind je de weg terug.</p>
  <div class="knoppen">
    <a href="/" class="btn btn-solid">Naar de homepage</a>
    <a href="/#contact" class="btn btn-outline">Contact opnemen</a>
  </div>
  <p class="tel">Liever bellen? <a href="tel:+32476548643">0476/54.86.43</a> · TimmersDesign, Tessenderlo-Ham</p>
</main>
</body>
</html>
